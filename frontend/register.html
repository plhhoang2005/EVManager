<!-- EVManager - Đăng Ký Tài Khoản Khách Hàng (register.html) -->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - EVManager</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main class="auth-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="auth-top-nav">
                <a href="index.html" class="back-home-link">← Trang chủ EVManager</a>
            </div>
            <p class="eyebrow" style="color: var(--teal); font-weight: 700;">HỒ SƠ KHÁCH HÀNG & ĐẶT TIỆC</p>
            <h1 id="login-title" style="font-size: 1.8rem; margin-bottom: 8px;">Đăng ký tài khoản</h1>
            <form id="registerForm" class="login-form">
                <label for="regUsername">Tên đăng nhập *</label>
                <input id="regUsername" name="username" type="text" autocomplete="username"
                    placeholder="ví dụ: khachhang01" required>

                <div class="form-row">
                    <div>
                        <label for="regFullName">Họ và tên *</label>
                        <input id="regFullName" name="fullName" type="text" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div>
                        <label for="regPhone">Số điện thoại *</label>
                        <input id="regPhone" name="phone" type="tel" placeholder="0901234567" required>
                    </div>
                </div>

                <label for="regEmail">Email liên hệ *</label>
                <input id="regEmail" name="email" type="email" placeholder="email@gmail.com" required>

                <label for="regAddress">Địa chỉ *</label>
                <input id="regAddress" name="address" type="text" placeholder="Quận/Huyện, Tỉnh/TP" required>

                <label for="regPassword">Mật khẩu *</label>
                <div class="password-field">
                    <input id="regPassword" name="password" type="password" autocomplete="new-password"
                        placeholder="Tối thiểu 8 ký tự" required>
                    <button type="button" class="password-toggle" aria-label="Hiện mật khẩu"
                        aria-pressed="false">Hiện</button>
                </div>

                <label for="regConfirmPassword">Xác nhận mật khẩu *</label>
                <div class="password-field">
                    <input id="regConfirmPassword" name="confirmPassword" type="password"
                        autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
                    <button type="button" class="password-toggle" aria-label="Hiện mật khẩu"
                        aria-pressed="false">Hiện</button>
                </div>

                <p id="registerError" class="login-error" role="alert" hidden></p>
                <button type="submit" class="login-button" style="margin-top: 12px;">
                    Đăng ký tài khoản <span aria-hidden="true">→</span>
                </button>

                <p style="margin-top: 14px; font-size: 0.85rem;">
                    Bạn đã có tài khoản? <a href="login.html" class="forgot-password" style="font-weight: 700;">Đăng nhập</a>
                </p>
            </form>
        </section>

        <aside class="auth-aside" aria-label="Thông tin hệ thống">
            <span class="aside-mark" aria-hidden="true">🏛️</span>
            <p class="eyebrow">EVManager Convention & Wedding</p>
            <h2>Đặt tiệc dễ dàng & theo dõi minh bạch.</h2>
            <p>Tạo tài khoản để trực tiếp theo dõi báo giá, hợp đồng dịch vụ và tình trạng thanh toán đặt cọc của bạn.</p>
        </aside>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
