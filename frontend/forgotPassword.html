<!-- Module Quên mật khẩu (forgotPassword.js)
 * Xử lý tương tác trên trang forgotPassword.html
 -->
 
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - LV34 Event Operations</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="auth-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="auth-top-nav">
                <a href="index.html" class="back-home-link">← Trang chủ</a>
            </div>
            <p class="eyebrow">Khôi phục tài khoản</p>
            <h1 id="login-title">Quên mật khẩu?</h1>
            <form id="forgotPasswordForm" class="login-form">
                <label for="recoveryAccount">Tên đăng nhập/Email</label>
                <input id="recoveryAccount" name="recoveryAccount" type="text" autocomplete="username" placeholder="Nhập tên đăng nhập hoặc email" required>
                
                <p id="forgotPasswordMessage" class="login-error" role="alert" hidden></p>
                <button type="submit" class="login-button">Gửi yêu cầu <span aria-hidden="true">→</span></button>
                
                <p><a href="login.html" class="forgot-password">Quay lại đăng nhập</a></p>
            </form>
        </section>  
        
        <aside class="auth-aside" aria-label="Thông tin hệ thống">
            <span class="aside-mark" aria-hidden="true">◒</span>
            <p class="eyebrow">Event operations</p>
            <h2>Mọi sự kiện<br>trong tầm mắt.</h2>
            <p>Theo dõi doanh thu, lịch trình và hợp đồng trong một không gian làm việc rõ ràng.</p>
        </aside>
    </main>

    <!-- Script riêng cho trang Quên mật khẩu -->
    <script src="js/forgotPassword.js"></script>
</body>
</html>
