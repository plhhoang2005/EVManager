services:
  - type: web
    name: evmanager-backend-staging
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: evmanager-staging-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: evmanager-staging-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: evmanager-staging-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: evmanager-staging-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: evmanager-staging-db
          property: password
      - key: DB_SSL_MODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173

databases:
  - name: evmanager-staging-db
    plan: free
    region: singapore
    databaseName: evmanager
    user: evmanager_user
