version: '3.8'
services:
  db:
    image: postgres:16
    container_name: evmanager_db_be04
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-evmanager}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - evmanager_pgdata_be04:/var/lib/postgresql/data
volumes:
  evmanager_pgdata_be04:
