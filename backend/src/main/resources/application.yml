spring:
  application:
    name: evmanager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:evmanager}?timezone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  web:
    resources:
      add-mappings: false

server:
  server-header: ""

app:
  jwt-secret: ${JWT_SECRET:4b29598f828a472c1c1f7b8801d014eb0237e3d1d1f0545f94943fcf11bb9e5f}
  jwt-expiration-milliseconds: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
    allow-credentials: true
    max-age: 3600
  security:
    rate-limit:
      enabled: true
      default-limit-per-minute: ${RATE_LIMIT_DEFAULT_PER_MIN:100}
      login-limit-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:5}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  file:
    name: logs/spring.log
