name: Backend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend CI (Lint, Test & Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evmanager
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend JavaScript Syntax Check
        run: |
          echo "Checking syntax for all JavaScript files in frontend/js/..."
          for file in frontend/js/*.js; do
            node --check "$file"
          done
          echo "All frontend JavaScript syntax checks passed."

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/mvnw

      - name: Verify Java and Maven Environment
        working-directory: backend
        run: |
          java -version
          ./mvnw -version

      - name: Backend Compile & Compiler Lint
        working-directory: backend
        run: |
          ./mvnw clean test-compile -Dmaven.compiler.showWarnings=true -Dmaven.compiler.compilerArgs="-Xlint:all,-processing"

      - name: Backend Unit & Integration Tests
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: evmanager
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
        run: |
          ./mvnw test

      - name: Backend Package & Verify Build
        working-directory: backend
        run: |
          ./mvnw verify -DskipTests
