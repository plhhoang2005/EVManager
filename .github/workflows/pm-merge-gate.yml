name: PR Lint & Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Conventional Commits Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Checking PR title: '$PR_TITLE'"
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\/]+\))?:\s.+"
          if [[ ! "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::PR title does not follow Conventional Commits format!"
            echo "Expected: <type>(<scope>): <subject>"
            echo "Examples:"
            echo "  - feat(backend): initialize auth module with JWT"
            echo "  - docs(ui): add user flow diagrams"
            echo "  - chore(deps): upgrade dependencies"
            exit 1
          fi
          echo "✅ PR title is valid according to Conventional Commits."
